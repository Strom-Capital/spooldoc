name: Website

# Builds the website in apps/site on pull requests, and deploys it to GitHub Pages
# (https://spooldoc.com) on pushes to main. The app's CI is in ci.yml.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'packages/docs/**'
      # The site reads the version from the root package.json and the changelog from
      # CHANGELOG.md, which a release changes, and the logo and favicons from the app's
      # brand folder.
      - 'package.json'
      - 'CHANGELOG.md'
      - 'apps/web/public/brand/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public PostHog project key (EU cloud). Unset: the site builds without analytics.
      PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
      # PostHog managed reverse proxy, https://e.spooldoc.com. Unset: events go to eu.i.posthog.com.
      PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the sitemap's <lastmod> and the guides' dateModified come from the
          # last commit to each page's file. A shallow clone builds without them.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The site and the packages it reads (@spooldoc/docs). No Java needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @spooldoc/site...

      - name: Build
        run: pnpm --filter @spooldoc/site... build

      - name: Check types
        run: pnpm --filter @spooldoc/site typecheck

      - name: Check links
        run: pnpm --filter @spooldoc/site check:links

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
