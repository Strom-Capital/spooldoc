# Example: docker compose up --build, then open http://localhost:3002.
# .env next to this file holds the settings (see apps/web/.env.example);
# BETTER_AUTH_SECRET and SPOOLDOC_SECRET_KEY are required; the chat model is set
# in the app under Settings. Chromium is set by the image.
#
# For development, start only the database (docker compose up -d db) and set
# DATABASE_URL=postgres://spooldoc:spooldoc@localhost:5433/spooldoc in
# apps/web/.env.local.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: spooldoc
      POSTGRES_PASSWORD: spooldoc
      POSTGRES_DB: spooldoc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spooldoc -d spooldoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: spooldoc
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://spooldoc:spooldoc@db:5432/spooldoc
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
