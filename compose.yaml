# Example: docker compose up -d, then open http://localhost:3000. This pulls the
# published image (ghcr.io/strom-capital/spooldoc); SPOOLDOC_VERSION in .env pins a
# release such as 0.1.0, latest otherwise. docker compose up --build -d builds the
# image from this checkout instead and tags it with the same name.
# .env next to this file holds the settings (see apps/web/.env.example);
# BETTER_AUTH_SECRET and SPOOLDOC_SECRET_KEY are required; the chat model and the
# Carbone connection are set in the app under Settings.
#
# Carbone renders every document. Spooldoc reaches it at http://carbone:4000, inside
# this network only, and signs each request with its own key. On first start, copy
# the public key from Settings, under Rendering, into CARBONE_AUTHENTICATION_PUBLIC_KEY
# in .env (one line, as shown), run docker compose up -d carbone, and click Check
# again. CARBONE_LICENSE in .env turns on Carbone's Enterprise features.
#
# For development, start only the database (docker compose up -d db) and set
# DATABASE_URL=postgres://spooldoc:spooldoc@localhost:5433/spooldoc in
# apps/web/.env.local. The database port is published on this machine only; set
# POSTGRES_PASSWORD (URL-safe characters) in .env for anything but local development.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: spooldoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spooldoc}
      POSTGRES_DB: spooldoc
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spooldoc -d spooldoc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  carbone:
    image: carbone/carbone-ee:full-5.15.5-fonts
    environment:
      CARBONE_AUTHENTICATION: "true"
      CARBONE_AUTHENTICATION_PUBLIC_KEY: ${CARBONE_AUTHENTICATION_PUBLIC_KEY:-}
      CARBONE_LICENSE: ${CARBONE_LICENSE:-}
    restart: unless-stopped

  web:
    image: ghcr.io/strom-capital/spooldoc:${SPOOLDOC_VERSION:-latest}
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://spooldoc:${POSTGRES_PASSWORD:-spooldoc}@db:5432/spooldoc
    depends_on:
      db:
        condition: service_healthy
      carbone:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
