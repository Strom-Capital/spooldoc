<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Spooldoc architecture">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3a3a38"/></marker>
  <marker id="tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#3a3a38"/></marker>
</defs>
<rect x="40" y="130" width="260" height="490" rx="12" fill="none" stroke="#bdbdb9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="56" y="152" font-size="12" font-weight="600" letter-spacing="1.2" fill="#60615e">IBM I</text>
<rect x="360" y="130" width="560" height="490" rx="12" fill="none" stroke="#bdbdb9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="376" y="152" font-size="12" font-weight="600" letter-spacing="1.2" fill="#60615e">SPOOLDOC</text>
<rect x="70" y="170" width="200" height="70" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="170.0" y="203.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Programs</text>
<text x="170.0" y="220.0" text-anchor="middle" font-size="11" fill="#60615e">print as they always have</text>
<path d="M170 240 V290" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="70" y="290" width="200" height="80" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="170.0" y="328.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Output queue</text>
<text x="170.0" y="345.0" text-anchor="middle" font-size="11" fill="#60615e">spooled files, *SCS text</text>
<path d="M170 370 V510" fill="none" stroke="#3a3a38" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#head)"/>
<rect x="70" y="510" width="200" height="62" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="170.0" y="532.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Data queue</text>
<text x="170.0" y="549.0" text-anchor="middle" font-size="11" fill="#60615e">optional: tells Spooldoc at once</text>
<text x="170.0" y="563.0" text-anchor="middle" font-size="11" fill="#60615e">when a file is ready</text>
<rect x="405" y="40" width="200" height="56" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="505.0" y="66.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Browser</text>
<text x="505.0" y="83.0" text-anchor="middle" font-size="11" fill="#60615e">whoever sets up the jobs</text>
<path d="M505 96 V170" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="390" y="170" width="230" height="70" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="505.0" y="196.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Job builder</text>
<text x="505.0" y="213.0" text-anchor="middle" font-size="11" fill="#60615e">page view, definition, JSON,</text>
<text x="505.0" y="227.0" text-anchor="middle" font-size="11" fill="#60615e">template, preview, versions</text>
<path d="M620 205 H650" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#tail)"/>
<rect x="650" y="170" width="215" height="70" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="757.5" y="196.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">AI assistant</text>
<text x="757.5" y="213.0" text-anchor="middle" font-size="11" fill="#60615e">proposes the definition and</text>
<text x="757.5" y="227.0" text-anchor="middle" font-size="11" fill="#60615e">the template, fixes what is missing</text>
<path d="M865 205 H960" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<text x="912" y="196" text-anchor="middle" font-size="11" fill="#60615e">masked page text</text>
<rect x="960" y="170" width="200" height="70" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="1060.0" y="196.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Model provider</text>
<text x="1060.0" y="213.0" text-anchor="middle" font-size="11" fill="#60615e">Anthropic, OpenAI, Google,</text>
<text x="1060.0" y="227.0" text-anchor="middle" font-size="11" fill="#60615e">OpenRouter, Gateway, local</text>
<rect x="390" y="272" width="130" height="56" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="455.0" y="298.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Watcher</text>
<text x="455.0" y="315.0" text-anchor="middle" font-size="11" fill="#60615e">polling, or real time</text>
<path d="M455 328 V370" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="390" y="370" width="90" height="84" rx="8" fill="#3159e8" stroke="#3159e8" stroke-width="1.5"/>
<text x="435.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Capture</text>
<text x="435.0" y="420.0" text-anchor="middle" font-size="11" fill="#ffffff">read the</text>
<text x="435.0" y="434.0" text-anchor="middle" font-size="11" fill="#ffffff">spooled file</text>
<rect x="492" y="370" width="90" height="84" rx="8" fill="#3159e8" stroke="#3159e8" stroke-width="1.5"/>
<text x="537.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Extract</text>
<text x="537.0" y="420.0" text-anchor="middle" font-size="11" fill="#ffffff">pages</text>
<text x="537.0" y="434.0" text-anchor="middle" font-size="11" fill="#ffffff">to JSON</text>
<rect x="594" y="370" width="90" height="84" rx="8" fill="#3159e8" stroke="#3159e8" stroke-width="1.5"/>
<text x="639.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Render</text>
<text x="639.0" y="420.0" text-anchor="middle" font-size="11" fill="#ffffff">HTML</text>
<text x="639.0" y="434.0" text-anchor="middle" font-size="11" fill="#ffffff">and PDF</text>
<rect x="696" y="370" width="90" height="84" rx="8" fill="#3159e8" stroke="#3159e8" stroke-width="1.5"/>
<text x="741.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Deliver</text>
<text x="741.0" y="420.0" text-anchor="middle" font-size="11" fill="#ffffff">files to the</text>
<text x="741.0" y="434.0" text-anchor="middle" font-size="11" fill="#ffffff">destination</text>
<rect x="798" y="370" width="90" height="84" rx="8" fill="#3159e8" stroke="#3159e8" stroke-width="1.5"/>
<text x="843.0" y="403.0" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Finish</text>
<text x="843.0" y="420.0" text-anchor="middle" font-size="11" fill="#ffffff">hold, move</text>
<text x="843.0" y="434.0" text-anchor="middle" font-size="11" fill="#ffffff">or delete</text>
<path d="M480 412 H492" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M582 412 H594" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M684 412 H696" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M786 412 H798" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M270 300 H390" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<text x="330" y="291" text-anchor="middle" font-size="11" fill="#60615e">new spooled files</text>
<path d="M270 350 H330 V412 H390" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)" marker-start="url(#tail)"/>
<text x="390" y="486" font-size="11" fill="#60615e">jt400: read the spooled file; after delivery hold, move or delete it</text>
<path d="M741 454 V520" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<text x="751" y="494" text-anchor="start" font-size="11" fill="#60615e">runs, samples, files</text>
<path d="M480 529 a155.0 9 0 0 1 310 0 v58 a155.0 9 0 0 1 -310 0 z" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<ellipse cx="635.0" cy="529" rx="155.0" ry="9" fill="none" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="635.0" y="559.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Postgres</text>
<text x="635.0" y="576.0" text-anchor="middle" font-size="11" fill="#60615e">servers, jobs, versions, samples, runs, files, assets</text>
<path d="M741 370 V342 H1060 V370" fill="none" stroke="#3a3a38" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="960" y="370" width="200" height="84" rx="8" fill="#fafafa" stroke="#d6d6d3" stroke-width="1.5"/>
<text x="1060.0" y="396.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f0f0f">Destination</text>
<text x="1060.0" y="413.0" text-anchor="middle" font-size="11" fill="#60615e">Spooldoc download now;</text>
<text x="1060.0" y="427.0" text-anchor="middle" font-size="11" fill="#60615e">SFTP, S3, IFS, email and</text>
<text x="1060.0" y="441.0" text-anchor="middle" font-size="11" fill="#60615e">webhooks later</text>
