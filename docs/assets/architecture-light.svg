<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Spooldoc architecture">
<title>Spooldoc architecture</title>
<desc>On the IBM i, programs print spooled files to an output queue. When real-time watching is on, the output queue also sends an entry per ready file to a data queue that Spooldoc creates. Spooldoc reaches the IBM i only through jt400, on host server ports 449 and 8470 to 8476. The job builder, used from a browser on port 3000, lists queues, captures a sample spooled file and sets up real-time watching through jt400; it saves jobs, samples and assets in Postgres and renders previews with Carbone. The agent works in the job builder and sends page text, masked if masking is on, to a model provider: Anthropic, Google, OpenAI, OpenRouter, Vercel AI Gateway or a local model. The agent has no connection to the IBM i. The queue watcher learns of new spooled files from the data queue or by polling, records the files it has seen in Postgres and starts a run. A run captures, extracts, renders, delivers and finishes: it reads the spooled file through jt400, sends each template with its JSON to Carbone, its own container, which makes PDF, HTML, DOCX or XLSX files, stores runs, samples and files in Postgres, writes files to an IFS folder on the IBM i for an IFS destination, and then holds, moves or deletes the spooled file.</desc>
